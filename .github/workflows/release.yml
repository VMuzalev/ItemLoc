name: Release

# Запускается, когда вы отправляете тег вида v0.6.0 (git tag v0.6.0 && git push origin v0.6.0),
# а также вручную или из workflow "Auto update" (при ручном запуске выбирайте не ветку, а тег).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # нужны теги и история для номера версии и списка изменений

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Проверить список языков
        run: python tools/check_locales.py

      - name: Запустить тесты
        run: |
          pip install lupa
          python -m unittest discover -s tests

      - name: Собрать базу названий (Build.lua и модули языков)
        run: python tools/build_data.py

      - name: Добавить сгенерированные файлы в индекс Git
        # Эти файлы в .gitignore, а упаковщик такие файлы пропускает.
        # Добавление в индекс (без коммита) делает их видимыми для упаковщика
        # и не сдвигает тег, по которому определяется версия.
        run: |
          git add -f Build.lua Modules
          git status --short | head -n 20

      - name: Пробная упаковка (без загрузки)
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Проверить содержимое архива
        run: |
          zip=$(ls .release/*.zip | head -n 1)
          echo "Архив: $zip ($(du -h "$zip" | cut -f1))"
          unzip -l "$zip" | head -n 60
          bash tools/verify_package.sh "$zip"

      - name: Очистить папку упаковки
        run: rm -rf .release

      - name: Опубликовать (CurseForge и GitHub Releases)
        uses: BigWigsMods/packager@v2

      - name: Запомнить выпущенную сборку данных
        # Только после успешной публикации: если выпуск упал, Auto update попробует снова.
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(grep -oP '^ItemLocDataBuild = "\K[^"]+' Build.lua)
          api="repos/${GITHUB_REPOSITORY}/contents/data_build.txt"
          current=$(gh api "$api" --jq '.content' | base64 -d | tr -d '[:space:]' || true)
          if [ "$build" = "$current" ]; then
            echo "data_build.txt уже содержит $build"
            exit 0
          fi
          sha=$(gh api "$api" --jq '.sha')
          gh api -X PUT "$api" \
            -f message="Выпущена версия ${GITHUB_REF_NAME}: данные сборки ${build}" \
            -f content="$(printf '%s\n' "$build" | base64 -w0)" \
            -f sha="$sha"
