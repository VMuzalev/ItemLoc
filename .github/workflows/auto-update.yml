name: Auto update

# Раз в сутки проверяет:
#  1) не изменился ли номер Interface (обновляет Polyglot.toc);
#  2) не появилась ли новая сборка клиента Forever (ищется автоматически на wago.tools и сервере Blizzard).
# Если что-то изменилось, выпускает новую версию (тег vX.Y.Z) и запускает workflow Release.
# Данные собирает и публикует Release, а сборку в data_build.txt он записывает после успешного выпуска.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Выпустить версию, даже если ничего не изменилось"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: auto-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Получить код
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Обновить номер Interface в Polyglot.toc
        uses: p3lim/toc-interface-updater@v4
        continue-on-error: true      # если определить номер не вышло, сборку данных всё равно проверим
        with:
          flavor: |
            forever

      - name: Определить новейшую сборку Forever
        id: build
        run: |
          new_build=$(python tools/build_data.py --check)
          echo "Новейшая сборка: $new_build"
          echo "new_build=$new_build" >> "$GITHUB_OUTPUT"

      - name: Решить, нужен ли выпуск
        id: decide
        env:
          NEW_BUILD: ${{ steps.build.outputs.new_build }}
          FORCE: ${{ inputs.force }}
        run: bash tools/decide_release.sh

      - name: Выпустить новую версию
        if: steps.decide.outputs.changed == 'true'
        env:
          NEW_BUILD: ${{ steps.build.outputs.new_build }}
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          last=${last:-v0.5.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major}.${minor}.$((patch + 1))"
          echo "Новая версия: $next"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- Polyglot.toc; then
            git add Polyglot.toc
            git commit -m "Автообновление: номер Interface"
          fi
          git tag -a "$next" -m "Автообновление: данные сборки ${NEW_BUILD}"
          git push origin "HEAD:${{ github.event.repository.default_branch }}" "$next"

          # Тег, созданный стандартным токеном, не запускает Release сам, поэтому запускаем явно
          gh workflow run release.yml --ref "$next"

      - name: Не дать GitHub отключить расписание
        # GitHub отключает запланированные запуски после 60 дней без активности в репозитории.
        # Это запасная мера, на неё нельзя полностью полагаться: иногда заглядывайте во вкладку Actions.
        if: always()
        run: gh workflow enable auto-update.yml || true
