name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Получить код
        uses: actions/checkout@v4

      - name: Установить Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Установить зависимости тестов
        run: pip install lupa

      - name: Проверить список языков
        run: python tools/check_locales.py

      - name: Проверить синтаксис shell-скриптов
        run: |
          bash -n tools/verify_package.sh
          bash -n tools/decide_release.sh

      - name: Запустить тесты
        run: python -m unittest discover -s tests -v
